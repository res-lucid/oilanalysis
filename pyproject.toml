[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oilanalysis"
version = "0.1.0"
description = "Grade oil samples with nested dichotomies of logistic regressions, evaluated on engine-grouped splits."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
requires-python = ">=3.11"
authors = [
    {name = "Maxwell Dix-Matthews"},
]
keywords = ["oil-analysis", "oil condition monitoring", "condition-monitoring", "nested-dichotomy", "nested dichotomies", "multiclass", "classification", "interpretable machine learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ndscape>=0.1.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.6",
    "scipy>=1.10",
    "matplotlib>=3.10",
    "xgboost>=2.0",
    "joblib>=1.2",
]

[project.scripts]
oilanalysis-evaluate = "oilanalysis.evaluate:main"
oilanalysis-report = "oilanalysis.report:main"

[project.urls]
Homepage = "https://github.com/res-lucid/oilanalysis"
Repository = "https://github.com/res-lucid/oilanalysis"
Issues = "https://github.com/res-lucid/oilanalysis/issues"
ndscape = "https://github.com/res-lucid/ndscape"

[tool.setuptools]
packages = ["oilanalysis"]

[tool.setuptools.package-data]
oilanalysis = ["data/*.csv", "fonts/*.otf"]
